<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1250" viewBox="0 0 2000 1250"><title>Jarvis Disc Mk I wiring diagram</title>
<rect width="2000" height="1250" fill="#0b0f14"/>
<text x="80" y="90" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" fill="#d9b87c" text-anchor="start"  letter-spacing="10">JARVIS DISC  MK I</text><text x="80" y="128" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#7d8c9c" text-anchor="start"  letter-spacing="2">Wiring diagram: build with XIAO ESP32-S3, two I2S mics and a MAX98357A amp</text>
<rect x="80" y="220" width="260" height="150" rx="8" fill="#121820" stroke="#e0605a" stroke-width="1.5"/><text x="98" y="250" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#cdd6df" text-anchor="start" font-weight="500" >USB-C power in</text><text x="98" y="276" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >USB-C PD sink/controller</text><text x="98" y="298" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >negotiated profile TBD from load tests</text><text x="98" y="320" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >cable and source ratings must match</text>
<rect x="420" y="220" width="220" height="150" rx="8" fill="#121820" stroke="#e0605a" stroke-width="1.5"/><text x="438" y="250" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#cdd6df" text-anchor="start" font-weight="500" >Protection</text><text x="438" y="276" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >input protection coordinated with ratings</text><text x="438" y="298" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >DC/DC stage to regulated 5 V rail</text>
<polyline points="340,295 420,295" fill="none" stroke="#e0605a" stroke-width="2" stroke-linejoin="round"/><text x="365" y="285" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#e0605a" text-anchor="start"   >PD input</text>
<rect x="720" y="150" width="330" height="130" rx="8" fill="#121820" stroke="#e0605a" stroke-width="1.5"/><text x="738" y="180" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#cdd6df" text-anchor="start" font-weight="500"  >5 V distribution</text><text x="738" y="206" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >5 V distribution: supply and fuse</text><text x="738" y="228" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >ratings TBD pending measured load</text><text x="738" y="250" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >87 pixels: theoretical 5.22 A bound</text>
<polyline points="640,295 680,295 680,215 720,215" fill="none" stroke="#e0605a" stroke-width="2" stroke-linejoin="round"/><text x="650" y="210" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#e0605a" text-anchor="start"  >5 V</text>
<rect x="720" y="380" width="360" height="470" rx="8" fill="#121820" stroke="#d9b87c" stroke-width="1.5"/><text x="738" y="410" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#d9b87c" text-anchor="start" font-weight="500" >XIAO ESP32-S3</text><text x="738" y="436" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >5V in from the rail, 3V3 out</text><text x="738" y="458" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  ></text><text x="738" y="480" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >D0  GPIO1   I2S out BCLK</text><text x="738" y="502" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >D1  GPIO2   I2S out LRC</text><text x="738" y="524" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >D2  GPIO3   I2S out DIN</text><text x="738" y="546" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >D3  GPIO4   LED data (via shifter)</text><text x="738" y="568" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >D5  GPIO6   mute-state sense only</text><text x="738" y="590" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >D8  GPIO7   I2S in BCLK</text><text x="738" y="612" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >D9  GPIO8   I2S in WS</text><text x="738" y="634" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >D10 GPIO9   I2S in data</text><text x="738" y="656" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  ></text><text x="738" y="678" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >GND common to everything</text>
<polyline points="640,330 680,330 680,415 720,415" fill="none" stroke="#e0605a" stroke-width="2" stroke-linejoin="round"/><text x="650" y="325" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#e0605a" text-anchor="start"  >5 V</text>
<rect x="1260" y="330" width="330" height="170" rx="8" fill="#121820" stroke="#6fb8d8" stroke-width="1.5"/><text x="1278" y="360" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#cdd6df" text-anchor="start" font-weight="500" >Adafruit 3006: MAX98357A amp</text><text x="1278" y="386" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >VIN 5 V, GND</text><text x="1278" y="408" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >BCLK, LRC, DIN from the ESP32</text><text x="1278" y="430" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >GAIN open (9 dB), SD to 3V3</text><text x="1278" y="452" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >OUT+  OUT-  to the speaker</text>
<rect x="1700" y="360" width="260" height="110" rx="8" fill="#121820" stroke="#6fb8d8" stroke-width="1.5"/><text x="1718" y="390" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#cdd6df" text-anchor="start" font-weight="500" >Speaker: Dayton CE52N-4</text><text x="1718" y="416" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >4 ohm, 5 W, 52 mm round</text><text x="1718" y="438" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >sealed plinth, faces down</text>
<polyline points="1080,495 1180,495 1180,360 1260,360" fill="none" stroke="#6fb8d8" stroke-width="2" stroke-linejoin="round"/><text x="1100" y="488" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#6fb8d8" text-anchor="start"  >BCLK / LRC / DIN</text>
<polyline points="1590,415 1700,415" fill="none" stroke="#6fb8d8" stroke-width="2" stroke-linejoin="round"/><text x="1600" y="405" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#6fb8d8" text-anchor="start"  >OUT+ / OUT-</text>
<rect x="1260" y="570" width="330" height="190" rx="8" fill="#121820" stroke="#6fb8d8" stroke-width="1.5"/><text x="1278" y="600" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#cdd6df" text-anchor="start" font-weight="500" >Mics: 2 x INMP441 (I2S)</text><text x="1278" y="626" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >VDD 3V3, GND</text><text x="1278" y="648" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >SCK &lt;- D8, WS &lt;- D9</text><text x="1278" y="670" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >SD (both mics) -> D10</text><text x="1278" y="692" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >L/R: one to GND, one to 3V3</text><text x="1278" y="714" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >under two of the four ports</text>
<polyline points="1080,710 1260,710" fill="none" stroke="#6fb8d8" stroke-width="2" stroke-linejoin="round"/><text x="1110" y="702" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#6fb8d8" text-anchor="start"  >SCK / WS / SD</text>
<rect x="1260" y="800" width="670" height="70" rx="8" fill="none" stroke="#3a4756" stroke-dasharray="6 5"/><text x="1280" y="830" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >Better option: ReSpeaker XVF3800 4-mic array on XIAO ESP32-S3. It adds echo cancellation,</text><text x="1280" y="852" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >so you can talk over Jarvis. Its I2S pins are fixed on the board; use its pin table instead.</text>
<rect x="720" y="920" width="360" height="150" rx="8" fill="#121820" stroke="#e8b45a" stroke-width="1.5"/><text x="738" y="950" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#cdd6df" text-anchor="start" font-weight="500" >74AHCT125 level shifter</text><text x="738" y="976" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >powered from 5 V</text><text x="738" y="998" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >in &lt;- D3 (3.3 V), out -> 330 ohm</text><text x="738" y="1020" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >then to the LED data line</text>
<polyline points="900,850 900,920" fill="none" stroke="#e8b45a" stroke-width="2" stroke-linejoin="round"/><text x="910" y="890" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#e8b45a" text-anchor="start"  >GPIO4</text>
<rect x="1260" y="920" width="330" height="150" rx="8" fill="#121820" stroke="#e8b45a" stroke-width="1.5"/><text x="1278" y="950" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#cdd6df" text-anchor="start" font-weight="500" >LED PCB, 70 LEDs</text><text x="1278" y="976" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >5 V, GND, DIN</text><text x="1278" y="998" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >chain order: 0-11, 12-35,</text><text x="1278" y="1020" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >36-68, marker 69</text>
<rect x="1700" y="920" width="230" height="150" rx="8" fill="#121820" stroke="#e8b45a" stroke-width="1.5"/><text x="1718" y="950" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#cdd6df" text-anchor="start" font-weight="500" >Seam strip</text><text x="1718" y="976" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >17 LEDs, 5-6 mm wide</text><text x="1718" y="998" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >DIN from the PCB DOUT</text>
<polyline points="1080,995 1260,995" fill="none" stroke="#e8b45a" stroke-width="2" stroke-linejoin="round"/><text x="1100" y="985" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#e8b45a" text-anchor="start"  >330 ohm, data</text>
<polyline points="1590,995 1700,995" fill="none" stroke="#e8b45a" stroke-width="2" stroke-linejoin="round"/><text x="1600" y="985" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#e8b45a" text-anchor="start"  >DOUT to DIN</text>
<polyline points="1050,215 1985,215 1985,1100 1425,1100 1425,1070" fill="none" stroke="#e0605a" stroke-width="2" stroke-linejoin="round"/><text x="1560" y="205" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#e0605a" text-anchor="start"  >5 V and GND to the LED PCB and seam strip</text>
<rect x="80" y="460" width="430" height="190" rx="8" fill="#121820" stroke="#6fd29a" stroke-width="1.5"/><text x="98" y="490" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#cdd6df" text-anchor="start" font-weight="500" >Physical mic mute: latching 4PDT + aux</text><text x="98" y="516" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >4 poles isolate mic 3V3, BCLK, WS and SD</text><text x="98" y="538" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >Aux dry contact reports position to D5 / GPIO6</text><text x="98" y="560" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >D5 is read-only; firmware cannot defeat isolation</text><text x="98" y="582" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >Exact switch, schematic and bench validation pending</text>
<polyline points="510,555 720,555" fill="none" stroke="#6fd29a" stroke-width="2" stroke-linejoin="round"/><text x="565" y="547" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#6fd29a" text-anchor="start"  >aux state only</text>
<text x="80" y="1134" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >Every 5 V consumer uses the regulated distribution rail; supply, converter and fuse ratings are TBD pending complete-device measurements.</text><text x="80" y="1160" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >Pin numbers are for the Seeed XIAO ESP32-S3 (D0 to D10 = GPIO1, 2, 3, 4, 5, 6, 43, 44, 7, 8, 9). The I2S pins can be moved; verify against the datasheet before ordering.</text><text x="80" y="1186" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#7d8c9c" text-anchor="start"  >Keep the LED data wire short, join all grounds at one point, and never connect the 5 V rail to a 3.3 V pin (INMP441 and the ESP32 inputs are 3.3 V only).</text></svg>
