<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'">
<title>JARVIS Settings</title>
<link rel="stylesheet" href="palette.css">
<link rel="stylesheet" href="settings.css">
</head>
<body>
<div class="panel">
  <header class="head">
    <span class="brand">SETTINGS</span>
    <span class="saved" id="saved"></span>
    <button class="icon-btn" id="closeBtn" type="button" title="Close (Esc)">×</button>
  </header>
  <main class="body">
    <section>
      <h2>MODEL</h2>
      <label class="row"><span>Provider</span><select id="provider"></select></label>
      <p class="hint" id="providerDetail"></p>
    </section>
    <section>
      <h2>VOICE</h2>
      <label class="row"><span>Speech to text</span><select id="stt"></select></label>
      <label class="row"><span>Text to speech</span><select id="tts"></select></label>
      <label class="row"><span>Wake word engine</span><select id="wake"></select></label>
      <label class="row"><span>Wake on "Jarvis"</span><input type="checkbox" id="wakeEnabled"></label>
      <label class="row"><span>Microphone</span><select id="mic"></select></label>
      <p class="hint" id="micDetail"></p>
      <label class="row"><span>Voice rate <b id="rateVal"></b></span><input type="range" id="rate" min="0.5" max="2" step="0.05"></label>
    </section>
    <section>
      <h2>HOTKEYS</h2>
      <label class="row"><span>Open chat</span><input class="key" id="hkChat" readonly placeholder="Click, then press keys"></label>
      <label class="row"><span>Talk</span><input class="key" id="hkVoice" readonly placeholder="Click, then press keys"></label>
      <p class="warn" id="hkWarn" hidden></p>
    </section>
    <p class="err" id="errors" hidden></p>
  </main>
</div>
<script src="settings.js"></script>
</body>
</html>
